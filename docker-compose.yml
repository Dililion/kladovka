version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kladovka-postgres
    environment:
      POSTGRES_DB: kladovka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kladovka-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kladovka-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kladovka
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kladovka-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kladovka-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kladovka-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kladovka-network:
    driver: bridge
